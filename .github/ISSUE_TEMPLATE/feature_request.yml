name: Feature request
description: Suggest a focused improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not only a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Suggested scope and acceptance criteria
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, security, or dependency impact
      description: Note any new network access, stored data, permission, dependency, or AI capability.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same request.
          required: true
        - label: I did not include personal data, credentials, or private source content.
          required: true
